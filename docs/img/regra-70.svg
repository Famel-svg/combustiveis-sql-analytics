<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Regra dos 70%: quando o etanol compensa</text>
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#4b5563">Exemplo ilustrativo com valores fictícios, não são dados da ANP</text>

  <!-- eixo base -->
  <line x1="90" y1="290" x2="650" y2="290" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- escala: 1 R$ = 30 px -->
  <!-- gasolina R$ 6,00 -->
  <rect x="130" y="110" width="110" height="180" fill="#f59e0b" rx="4"/>
  <text x="185" y="100" text-anchor="middle" font-size="14" fill="#1f2937">R$ 6,00</text>
  <text x="185" y="312" text-anchor="middle" font-size="14" fill="#1f2937">Gasolina</text>

  <!-- etanol A R$ 4,00 (66,7%, compensa) -->
  <rect x="300" y="170" width="110" height="120" fill="#16a34a" rx="4"/>
  <text x="355" y="160" text-anchor="middle" font-size="14" fill="#1f2937">R$ 4,00</text>
  <text x="355" y="312" text-anchor="middle" font-size="14" fill="#1f2937">Etanol A</text>
  <text x="355" y="330" text-anchor="middle" font-size="13" fill="#16a34a">66,7% → compensa</text>

  <!-- etanol B R$ 4,60 (76,7%, não compensa) -->
  <rect x="470" y="152" width="110" height="138" fill="#dc2626" rx="4"/>
  <text x="525" y="142" text-anchor="middle" font-size="14" fill="#1f2937">R$ 4,60</text>
  <text x="525" y="312" text-anchor="middle" font-size="14" fill="#1f2937">Etanol B</text>
  <text x="525" y="330" text-anchor="middle" font-size="13" fill="#dc2626">76,7% → não compensa</text>

  <!-- limite 70% = R$ 4,20 -->
  <line x1="90" y1="164" x2="650" y2="164" stroke="#1f2937" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="650" y="158" text-anchor="end" font-size="13" fill="#1f2937">Limite 70%: R$ 4,20</text>
</svg>
